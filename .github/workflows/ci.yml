name: CI
on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python train.py --steps 2 --batch-size 2 --d-model 32 --layers 2 --heads 4 --block-size 32 --output /tmp/aetherion-smoke.pt
      - run: python generate.py --checkpoint /tmp/aetherion-smoke.pt --prompt "Hello" --tokens 4

      - run: python train.py --steps 3 --batch-size 2 --d-model 32 --layers 2 --heads 4 --block-size 32 --resume /tmp/aetherion-smoke.pt --output /tmp/aetherion-smoke.pt
