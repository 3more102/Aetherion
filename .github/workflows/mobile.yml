name: Mobile ONNX export parity
on:
  push:
  pull_request:

jobs:
  mobile-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt onnx==1.23.2 onnxruntime==1.32.0 onnx_ir
      - run: python -m pytest -q tests/test_mobile_export.py tests/test_mobile_quantization.py tests/test_mobile_cached.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd mobile && npm install --no-audit --no-fund && npm run stage-runtime && npm run check
      - run: python -m mobile.ci_synthetic_models mobile/artifacts/ci
      - run: node mobile/runtime_smoke.mjs mobile/artifacts/ci
      - run: node mobile/app_state_smoke.mjs
